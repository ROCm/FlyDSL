name: Publish FlyDSL to PyPI

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      tag_version: ${{ steps.version.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_VERSION="$(awk -F'"' '/^__version__ = / {print $2; exit}' python/flydsl/__init__.py)"

          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "Release validation requires the complete Git history" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not on origin/main" >&2
            exit 1
          fi

          if [ -z "${SOURCE_VERSION}" ]; then
            echo "Failed to find __version__ in python/flydsl/__init__.py" >&2
            exit 1
          fi

          if [ "${TAG_VERSION}" = "${SOURCE_VERSION}" ]; then
            PACKAGE_VERSION="${SOURCE_VERSION}"
          else
            TAG_PREFIX="${SOURCE_VERSION}.dev"
            TAG_DEV_NUMBER="${TAG_VERSION#${TAG_PREFIX}}"
            if [ "${TAG_DEV_NUMBER}" = "${TAG_VERSION}" ] || [[ ! "${TAG_DEV_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "Tag ${GITHUB_REF_NAME} must match ${TAG_PREFIX}<number> or ${SOURCE_VERSION}" >&2
              exit 1
            fi

            COMMIT_COUNT="$(git rev-list --count HEAD)"
            if [ -z "${COMMIT_COUNT}" ]; then
              echo "Failed to derive dev version from git rev-list" >&2
              exit 1
            fi

            MAX_PREVIOUS_DEV_NUMBER=0
            while IFS= read -r EXISTING_TAG; do
              if [ "${EXISTING_TAG}" = "${GITHUB_REF_NAME}" ]; then
                continue
              fi
              SUFFIX="${EXISTING_TAG#v${SOURCE_VERSION}.dev}"
              if [[ "${SUFFIX}" =~ ^[0-9]+$ ]] && ((10#${SUFFIX} > MAX_PREVIOUS_DEV_NUMBER)); then
                MAX_PREVIOUS_DEV_NUMBER=$((10#${SUFFIX}))
              fi
            done < <(git tag --list "v${SOURCE_VERSION}.dev*")

            EXPECTED_DEV_NUMBER=$((10#${COMMIT_COUNT}))
            if ((MAX_PREVIOUS_DEV_NUMBER >= EXPECTED_DEV_NUMBER)); then
              EXPECTED_DEV_NUMBER=$((MAX_PREVIOUS_DEV_NUMBER + 1))
            fi

            if ((10#${TAG_DEV_NUMBER} != EXPECTED_DEV_NUMBER)); then
              echo "Tag ${GITHUB_REF_NAME} must be the next dev version: v${SOURCE_VERSION}.dev${EXPECTED_DEV_NUMBER}" >&2
              exit 1
            fi

            PACKAGE_VERSION="${TAG_VERSION}"
          fi

          echo "package_version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag_version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate_tag
    uses: ./.github/workflows/build-whl.yaml
    with:
      release_type: release
      upload_s3_staging: false
      package_version_override: ${{ needs.validate_tag.outputs.package_version }}
    permissions:
      id-token: write
      contents: read

  test:
    needs: [validate_tag, build]
    uses: ./.github/workflows/test-whl.yaml
    with:
      docker_image: rocm/pytorch:rocm7.14_ubuntu24.04_py3.11_pytorch_release_2.12.0@sha256:05743468394cc8f9cce06822635836a31ddfd5956bac36976666d7057713441d
    permissions:
      contents: read

  publish:
    needs: [validate_tag, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: flydsl-wheels
          path: dist

      - name: Prepare PyPI distributions
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl pypi-dist/
          ls -lh pypi-dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate distributions
        run: |
          python -m pip install -U twine
          python -m twine check pypi-dist/*.whl

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist/
          skip-existing: true

      - name: Publish summary
        run: |
          {
            echo "## PyPI Publish Summary"
            echo
            echo "Published tag: \`${GITHUB_REF_NAME}\`"
            echo "Package version: \`${{ needs.validate_tag.outputs.package_version }}\`"
            echo
            echo "Published package: \`flydsl\`"
            echo
            echo "### Distributions"
            echo '```'
            ls -1 pypi-dist/*.whl
            echo '```'
            echo
            echo "### Install"
            echo '```bash'
            echo "pip install flydsl==${{ needs.validate_tag.outputs.package_version }}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
