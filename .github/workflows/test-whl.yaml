name: Test Wheels

on:
  workflow_call:
    inputs:
      docker_image:
        description: 'Docker base image for testing'
        type: string
        required: true
      aiter_ref:
        description: 'aiter branch or tag for the current CSV/HGEMM run (compared against aiter main)'
        type: string
        required: false
        default: 'main'

jobs:
  test:
    env:
      # Some self-hosted runners configure a GitHub -> git-cache URL rewrite.
      # If that cache is unavailable, checkout fails before the tests start.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    strategy:
      matrix:
        runners: ['linux-flydsl-mi325-1', 'linux-flydsl-mi355-1', 'linux-flydsl-mi35x-1']
      fail-fast: false
    runs-on: ${{ matrix.runners }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          # Keep checkout independent of runner-local git-cache rewrites.
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/flydsl-gitconfig
          GIT_CONFIG_NOSYSTEM: "1"
        with:
          path: flydsl

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          name: flydsl-wheels
          path: dist

      - name: Start GPU test container
        run: |
          docker ps -aq -f name=flydsl_test | xargs -r docker stop | xargs -r docker rm || true

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          docker run -dt --network=host --user root --device=/dev/kfd $DEVICE_FLAG \
            -v "${GITHUB_WORKSPACE}/flydsl:/flydsl" \
            -v "${GITHUB_WORKSPACE}/dist:/dist" \
            --ipc=host --group-add video \
            --shm-size 16g \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            -w /flydsl \
            --name flydsl_test \
            ${{ inputs.docker_image }}

      - name: Install wheels and dependencies
        id: install
        run: |
          docker exec flydsl_test bash -c "python3 -m pip install -U pip setuptools"
          docker exec flydsl_test bash -c "python3 -m pip install --no-index --find-links=/dist flydsl"
          docker exec flydsl_test bash -c "python3 -m pip install -U 'hypothesis>=6.82.0'"
          docker exec flydsl_test bash -c "mkdir -p /flydsl/build-fly/bin && cp /dist/fly-opt /flydsl/build-fly/bin/fly-opt && chmod +x /flydsl/build-fly/bin/fly-opt"
          docker exec flydsl_test bash -c "git config --global --add safe.directory /flydsl"

      - name: Run tests
        id: tests
        run: |
          docker exec flydsl_test bash -c "cd /flydsl && RUN_TESTS_FULL=1 bash scripts/run_tests.sh" 2>&1 | tee /tmp/test_output.log

      - name: Show test logs
        if: failure()
        run: |
          docker exec flydsl_test bash -c 'cd /tmp && tar czf /tmp/logs.tgz *.log 2>/dev/null || echo "no logs"'
          docker cp flydsl_test:/tmp/logs.tgz . || true
          if [ -f logs.tgz ]; then
            tar -xzf logs.tgz || true
            cat *.log || true
          fi

      - name: Run benchmarks
        id: benchmarks
        run: |
          docker exec flydsl_test bash -c "cd /flydsl && bash scripts/run_benchmark.sh" 2>&1 | tee /tmp/bench_output.log

      - name: Show benchmark logs
        if: failure()
        run: |
          docker exec flydsl_test bash -c 'cd /tmp/flydsl_bench && tar czf /tmp/flydsl_bench/logs.tgz *.log 2>/dev/null || echo "no logs"'
          docker cp flydsl_test:/tmp/flydsl_bench/logs.tgz . || true
          if [ -f logs.tgz ]; then
            tar -xzf logs.tgz || true
            cat *.log || true
          fi

      # gfx950: aiter CSV MoE (kimik3/dsv4/glm5 from aiter main) + HGEMM.
      # Current checkout is inputs.aiter_ref; when that is not main, also run
      # aiter main and compare the two tuned_op_bench.csv files.
      - name: Prepare aiter
        if: ${{ !contains(matrix.runners, 'mi325') }}
        env:
          AITER_REF: ${{ inputs.aiter_ref }}
        run: |
          docker exec -e AITER_REF -i flydsl_test bash <<'BASH'
          set -euo pipefail
          REF="${AITER_REF:-main}"
          rm -rf /tmp/aiter /tmp/aiter-main
          git clone --depth 1 --recursive --shallow-submodules --branch "${REF}" https://github.com/ROCm/aiter.git /tmp/aiter
          if [ "${REF}" != "main" ]; then
            git clone --depth 1 --recursive --shallow-submodules --branch main https://github.com/ROCm/aiter.git /tmp/aiter-main
          fi
          python3 -c "from pathlib import Path; src = Path('/tmp/aiter/requirements.txt'); dst = Path('/tmp/aiter/requirements-flydsl-ci.txt'); lines = [line for line in src.read_text().splitlines() if line.strip() and not line.strip().startswith('flydsl==')]; dst.write_text('\\n'.join(lines) + '\\n')"
          python3 -m pip install -r /tmp/aiter/requirements-flydsl-ci.txt
          BASH

      - name: Run aiter CSV MoE and HGEMM
        id: aiter
        if: ${{ !contains(matrix.runners, 'mi325') }}
        timeout-minutes: 360
        env:
          AITER_REF: ${{ inputs.aiter_ref }}
        run: |
          docker exec -e AITER_REF -i flydsl_test bash <<'BASH' 2>&1 | tee /tmp/aiter_output.log
          set -euo pipefail
          REF="${AITER_REF:-main}"
          PYTHONPATH_BASE="${PYTHONPATH:-}"
          MAIN_ROOT=/tmp/aiter
          if [ -d /tmp/aiter-main ]; then
            MAIN_ROOT=/tmp/aiter-main
          fi
          CFG="${MAIN_ROOT}/aiter/configs/model_configs"
          FMOE="${CFG}/kimik3_a8w4_tuned_fmoe.csv:${CFG}/dsv4_fp8fp4_tuned_fmoe.csv:${CFG}/glm5_fp4_tuned_fmoe.csv"

          run_moe_csv() {
            root="$1"
            out="$2"
            rm -f "${out}"
            export PYTHONPATH="${root}:${PYTHONPATH_BASE}"
            export AITER_REPO="${root}"
            export AITER_CONFIG_FMOE="${FMOE}"
            export AITER_TUNED_OP_BENCH_CSV="${out}"
            export FLYDSL_RUNTIME_CACHE_DIR="/tmp/flydsl_cache_$(basename "${root}")"
            python3 "${root}/op_tests/test_moe_2stage.py" --no-legacy --csv-filter flydsl_
          }

          echo "=== aiter current (${REF}) CSV MoE ==="
          run_moe_csv /tmp/aiter /tmp/tuned_op_bench_current.csv
          PYTHONPATH="/tmp/aiter:${PYTHONPATH_BASE}" AITER_REPO=/tmp/aiter python3 /tmp/aiter/op_tests/test_flydsl_hgemm.py

          if [ -d /tmp/aiter-main ]; then
            echo "=== aiter main CSV MoE ==="
            run_moe_csv /tmp/aiter-main /tmp/tuned_op_bench_main.csv
            python3 /tmp/aiter-main/.github/scripts/compare_benchmark.py \
              /tmp/tuned_op_bench_main.csv \
              /tmp/tuned_op_bench_current.csv \
              --baseline-label "aiter-main" \
              --current-label "aiter-${REF}"
          else
            echo "aiter_ref is main; skipping vs-main CSV compare"
          fi
          BASH

      - name: Show aiter logs
        if: failure()
        run: |
          if [ -f /tmp/aiter_output.log ]; then
            tail -n 200 /tmp/aiter_output.log
          fi

      - name: Test summary
        if: always()
        env:
          SUMMARY_RUNNER: ${{ matrix.runners }}
          SUMMARY_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SUMMARY_TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SUMMARY_BENCHMARKS_OUTCOME: ${{ steps.benchmarks.outcome }}
          SUMMARY_AITER_OUTCOME: ${{ steps.aiter.outcome }}
          SUMMARY_TEST_LOG: /tmp/test_output.log
          SUMMARY_BENCH_LOG: /tmp/bench_output.log
          SUMMARY_AITER_LOG: /tmp/aiter_output.log
        run: python3 flydsl/scripts/generate_summary.py test

      - name: Clean up
        if: always()
        run: |
          docker stop flydsl_test || true
          docker rm flydsl_test || true
