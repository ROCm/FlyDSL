repos:
  - repo: local
    hooks:
      - id: black
        name: Format Python with Black
        entry: python3 -m black
        language: system
        types: [python]
        exclude: ^(?:\.claude/|build/|build-fly/|build_.*|thirdparty/)

      - id: ruff
        name: Fix Python lint with Ruff
        entry: python3 -m ruff check --fix
        language: system
        types: [python]
        exclude: ^(?:\.claude/|build/|build-fly/|build_.*|thirdparty/)

      - id: black-final
        name: Normalize Ruff fixes with Black
        entry: python3 -m black
        language: system
        types: [python]
        exclude: ^(?:\.claude/|build/|build-fly/|build_.*|thirdparty/)
